services:

  postgres:
    image: postgres:16
    container_name: cloudscale_postgres
    restart: always
    environment:
      POSTGRES_USER: cloudscale
      POSTGRES_PASSWORD: cloudscale123
      POSTGRES_DB: cloudscale
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: cloudscale_redis
    restart: always
    ports:
      - "6379:6379"


volumes:

  postgres_data: