version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudscale_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cloudscale
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: cloudscale_redis
    ports:
      - "6379:6379"
